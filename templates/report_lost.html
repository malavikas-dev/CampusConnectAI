<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Lost Item</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<section class="form-section">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="form-card">

<h2 class="form-title">

<i class="fa-solid fa-magnifying-glass-location"></i>

Report Lost Item

</h2>

<p class="form-subtitle">

Lost something on campus? Fill in the details below and let CampusConnect AI help you find it.

</p>

<form action="/report-lost"
      method="POST"
      enctype="multipart/form-data">

    <div class="mb-4">

        <label class="form-label">

            Item Name

        </label>

        <input
            type="text"
            name="item_name"
            class="form-control"
            placeholder="Example: Black HP Laptop"
            required>

    </div>

    <div class="mb-4">

        <label class="form-label">

            Category

        </label>

        <select
            name="category"
            class="form-select"
            required>

            <option value="">Select Category</option>
            <option>Bag</option>
            <option>Wallet</option>
            <option>Phone</option>
            <option>ID Card</option>
            <option>Laptop</option>
            <option>Keys</option>
            <option>Books</option>
            <option>Electronics</option>
            <option>Other</option>

        </select>

    </div>

    <div class="mb-4">

        <label class="form-label">

            Description

        </label>

        <textarea
            name="description"
            rows="4"
            class="form-control"
            placeholder="Describe your lost item..."
            required></textarea>

    </div>

    <div class="mb-4">

        <label class="form-label">

            Location Lost

        </label>

        <input
            type="text"
            name="location"
            class="form-control"
            placeholder="Example: Library, Block A"
            required>

    </div>

    <div class="mb-4">

        <label class="form-label">

            Date Lost

        </label>

        <input
            type="date"
            name="date"
            class="form-control"
            required>

    </div>

    <div class="mb-4">

        <label class="form-label">

            Your Name

        </label>

        <input
            type="text"
            name="owner"
            class="form-control"
            placeholder="Enter your full name"
            required>

    </div>

    <div class="mb-4">

        <label class="form-label">

            Phone Number

        </label>

        <input
            type="tel"
            name="phone"
            class="form-control"
            placeholder="Enter your phone number"
            required>

    </div>

    <div class="mb-3">

    <label class="form-label">
        Email Address
    </label>

    <input
        type="email"
        class="form-control"
        name="email"
        placeholder="Enter your email"
        required>

</div>

    <div class="mb-4">

        <label class="form-label">

            Upload Item Image

        </label>

        <div class="upload-box">

            <i class="fa-solid fa-cloud-arrow-up fa-3x mb-3 text-primary"></i>

            <p class="text-light mb-3">

                Choose an image of the lost item

            </p>

            <input
                type="file"
                name="image"
                class="form-control"
                accept="image/*">

        </div>

    </div>

    <button
        type="submit"
        class="btn btn-primary">

        <i class="fa-solid fa-paper-plane"></i>

        Submit Report

    </button>

</form>

</div>

</div>

</div>

</div>

</section>

</body>

</html>
