{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="glass-card mx-auto" style="max-width:500px;">

        <h2 class="section-title text-center mb-4">
            Create Account
        </h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input
                    type="text"
                    class="form-control"
                    name="name"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                    type="email"
                    class="form-control"
                    name="email"
                    required>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input
                    type="password"
                    class="form-control"
                    name="password"
                    required>
            </div>

            <button class="btn btn-success w-100">
                Create Account
            </button>

        </form>

    </div>

</div>

{% endblock %}
