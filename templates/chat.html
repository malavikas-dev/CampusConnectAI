<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusConnect AI Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#0f172a;
            color:white;
        }

        .chat-box{

            height:70vh;

            overflow-y:auto;

            background:#1e293b;

            padding:20px;

            border-radius:15px;
        }

        .mine{

            background:#2563eb;

            color:white;

            padding:12px;

            border-radius:15px;

            width:fit-content;

            max-width:70%;

            margin-left:auto;

            margin-bottom:15px;
        }

        .other{

            background:#334155;

            color:white;

            padding:12px;

            border-radius:15px;

            width:fit-content;

            max-width:70%;

            margin-bottom:15px;
        }

        input{

            background:#1e293b !important;

            color:white !important;

            border:none !important;
        }

    </style>

</head>

<body>

<div class="container py-5">

<h2 class="mb-4">
💬 Private Chat
</h2>

<div class="chat-box" id="chatBox">

{% for msg in messages %}

    {% if msg["sender_id"] == session["user_id"] %}

        <div class="mine">

            {{ msg["message"] }}

            <br>

            <small>{{ msg["created_at"] }}</small>

        </div>

    {% else %}

        <div class="other">

            <strong>{{ msg["name"] }}</strong><br>

{{ msg["message"] }}

            <br>

            <small>{{ msg["created_at"] }}</small>

        </div>

    {% endif %}

{% endfor %}

</div>

<form method="POST" class="mt-3">

<div class="input-group">

<input
type="text"
name="message"
class="form-control"
placeholder="Type your message..."
required>

<button class="btn btn-primary">

Send

</button>

</div>

</form>

</div>

<script>

const chat=document.getElementById("chatBox");

chat.scrollTop=chat.scrollHeight;

</script>

</body>

</html>
